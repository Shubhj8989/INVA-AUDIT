<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="InvAudit 2.0 – Automated inventory verification from scanned document images using Zonal OCR. Matches item codes and quantities across Tax Invoices, Picking Instructions, and Pick List Reports." />
  <title>InvAudit 2.0 • Inventory Verification from Scanned Documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // ── Backend API Base URL Configuration ──
    // When deployed on Vercel (frontend-only), set this to your Render backend URL.
    // e.g. window.BACKEND_BASE_URL = "https://inva-audit-backend.onrender.com";
    // When running locally (Node server serves this file), leave as empty string.
    window.BACKEND_BASE_URL = window.BACKEND_BASE_URL || "";
    window.OCR_API_URL = window.BACKEND_BASE_URL ? window.BACKEND_BASE_URL + "/api/ocr/process" : "";
    window.BATCH_API_BASE = window.BACKEND_BASE_URL ? window.BACKEND_BASE_URL + "/api/batch" : "/api/batch";
  </script>
  <style>

    :root {
      --bg-main: #080c16;
      --bg-card: #0f1624;
      --bg-card-hover: #16203a;
      --bg-input: #0a1020;
      --border-color: #1e2d4a;
      --border-focus: #3b82f6;
      --text-main: #e8edf5;
      --text-muted: #8898b8;
      --text-dim: #4d617f;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: rgba(59, 130, 246, 0.12);
      --cyan: #06b6d4;
      --green: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --violet: #8b5cf6;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg-main); color: var(--text-main); font-family: var(--font-sans); min-height: 100vh; }
    button { font-family: var(--font-sans); cursor: pointer; border: none; outline: none; transition: all 0.18s ease; }
    input, select, textarea { font-family: var(--font-sans); background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--r-sm); padding: 8px 12px; outline: none; transition: border-color 0.18s; font-size: 13px; }
    input:focus, select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

    /* ── LAYOUT ── */
    .header { background: rgba(15,22,36,0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 200; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-chip { background: linear-gradient(135deg, var(--primary) 0%, var(--cyan) 100%); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; padding: 5px 11px; border-radius: var(--r-sm); text-transform: uppercase; }
    .brand-name { font-size: 17px; font-weight: 700; }
    .brand-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--green); background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); padding: 4px 10px; border-radius: 20px; }
    .live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .tabs { display: flex; gap: 4px; background: var(--bg-input); padding: 4px; border-radius: var(--r-md); border: 1px solid var(--border-color); }
    .tab { background: transparent; color: var(--text-muted); padding: 8px 18px; font-size: 12px; font-weight: 500; border-radius: 7px; white-space: nowrap; }
    .tab:hover { color: var(--text-main); background: var(--bg-card); }
    .tab.active { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 2px 10px rgba(59,130,246,0.35); }

    .main { padding: 28px; max-width: 1480px; margin: 0 auto; }

    /* ── KPI STRIP ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
    .kpi { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--r-md); padding: 18px; position: relative; overflow: hidden; }
    .kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--ka); }
    .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); }
    .kpi-val { font-size: 26px; font-weight: 700; font-family: var(--font-mono); margin: 6px 0 2px; color: var(--text-main); }
    .kpi-sub { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

    /* ── PANEL ── */
    .panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--r-lg); padding: 22px; margin-bottom: 22px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); margin-bottom: 18px; }
    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── DROPZONE ── */
    .dropzone { border: 2px dashed var(--border-color); border-radius: var(--r-lg); padding: 44px 24px; text-align: center; background: rgba(10,16,32,0.5); cursor: pointer; transition: all 0.2s; position: relative; }
    .dropzone:hover, .dropzone.drag { border-color: var(--primary); background: var(--primary-light); }
    .dz-icon { font-size: 42px; margin-bottom: 12px; }
    .dz-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .dz-sub { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .dz-chips { display: flex; gap: 6px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .dz-chip { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 3px 11px; font-size: 11px; color: var(--text-muted); font-weight: 500; }

    /* ── PROGRESS ── */
    .prog-wrap { margin: 18px 0; }
    .prog-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .prog-label { font-size: 13px; font-weight: 600; }
    .prog-pct { font-size: 13px; font-family: var(--font-mono); color: var(--cyan); }
    .prog-bg { background: var(--bg-input); height: 8px; border-radius: 4px; overflow: hidden; }
    .prog-fill { background: linear-gradient(90deg, var(--primary), var(--cyan)); height: 100%; transition: width 0.4s ease; border-radius: 4px; }
    .prog-metrics { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }

    /* ── FILE QUEUE LIST ── */
    .file-queue { margin-top: 18px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: var(--r-md); }
    .file-row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
    .file-row:last-child { border-bottom: none; }
    .file-icon { font-size: 18px; flex-shrink: 0; }
    .file-name { flex: 1; color: var(--text-main); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-type { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
    .ft-invoice { background: rgba(59,130,246,0.18); color: var(--primary); }
    .ft-picking { background: rgba(6,182,212,0.18); color: var(--cyan); }
    .ft-picklist { background: rgba(139,92,246,0.18); color: var(--violet); }
    .ft-lr { background: rgba(245,158,11,0.18); color: var(--amber); }
    .ft-transfer { background: rgba(168,85,247,0.18); color: #c084fc; }
    .ft-purinv { background: rgba(16,185,129,0.18); color: var(--green); }
    .ft-grn { background: rgba(244,63,94,0.18); color: var(--rose); }
    .ft-unknown { background: rgba(78,90,110,0.3); color: var(--text-muted); }
    .file-status { font-size: 11px; }
    .fs-queued { color: var(--text-dim); }
    .fs-processing { color: var(--amber); }
    .fs-done { color: var(--green); }
    .fs-error { color: var(--rose); }

    /* ── WORKBENCH WITH REAL IMAGE VIEWER ── */
    .bench { display: grid; grid-template-columns: 280px 1.1fr 1.2fr; gap: 16px; align-items: start; }
    .doc-queue-sidebar { border: 1px solid var(--border-color); border-radius: var(--r-md); overflow: hidden; background: var(--bg-card); }
    .dqs-header { background: var(--bg-input); padding: 10px 14px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
    .dqs-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.15s; font-size: 12px; }
    .dqs-item:hover { background: var(--bg-card-hover); }
    .dqs-item.selected { background: var(--primary-light); border-left: 3px solid var(--primary); }
    .dqs-item:last-child { border-bottom: none; }
    .dqs-fname { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dqs-conf { font-family: var(--font-mono); font-size: 11px; }

    /* Document Image Viewer */
    .doc-viewer-pane { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; min-height: 520px; }
    .viewer-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 11px; color: var(--text-muted); }
    .viewer-btn-group { display: flex; gap: 6px; }
    .viewer-btn { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-main); font-size: 11px; padding: 3px 8px; cursor: pointer; transition: background 0.15s; }
    .viewer-btn:hover { background: var(--border-color); }
    .viewer-img-container { flex: 1; overflow: auto; border: 1px solid var(--border-color); border-radius: var(--r-sm); background: #070b14; display: flex; align-items: flex-start; justify-content: center; position: relative; max-height: 580px; }
    .viewer-img { max-width: 100%; transition: transform 0.2s ease; border-radius: 4px; }

    .editor-pane { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--r-md); padding: 18px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .field-block label { display: block; font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .field-block input { width: 100%; }

    /* ── TABLE ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th { background: var(--bg-input); color: var(--text-muted); padding: 9px 12px; font-weight: 600; border-bottom: 1px solid var(--border-color); text-align: left; white-space: nowrap; }
    tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    tbody tr:hover td { background: var(--bg-card-hover); }
    tbody tr:last-child td { border-bottom: none; }
    .mono { font-family: var(--font-mono); font-weight: 600; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .b-verified { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.35); }
    .b-review   { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.35); }
    .b-flagged  { background: rgba(244,63,94,0.15);  color: var(--rose);  border: 1px solid rgba(244,63,94,0.35); }
    .b-info     { background: rgba(59,130,246,0.15); color: var(--primary); border: 1px solid rgba(59,130,246,0.35); }
    .b-violet   { background: rgba(139,92,246,0.15); color: var(--violet); border: 1px solid rgba(139,92,246,0.35); }

    /* ── BUTTONS ── */
    .btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: var(--r-sm); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-main); }
    .btn-success { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid rgba(16,185,129,0.4); }
    .btn-success:hover { background: var(--green); color: #fff; }
    .btn-danger { background: rgba(244,63,94,0.2); color: var(--rose); border: 1px solid rgba(244,63,94,0.4); }

    /* ── RECONCILIATION MATCH ── */
    .match-row td:nth-child(6) { color: var(--text-dim); }
    .mismatch-row td:nth-child(6) { color: var(--rose); font-weight: 700; }

    /* ── REPORT CARDS ── */
    .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .report-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .report-card h4 { font-size: 13px; font-weight: 600; }
    .report-card p { font-size: 12px; color: var(--text-muted); line-height: 1.5; flex: 1; }

    /* ── FLOW DIAGRAM ── */
    .flow { display: flex; align-items: center; gap: 0; margin-bottom: 28px; overflow-x: auto; padding: 4px; }
    .flow-step { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--r-md); padding: 14px 18px; min-width: 160px; text-align: center; }
    .flow-step-icon { font-size: 24px; margin-bottom: 6px; }
    .flow-step-label { font-size: 12px; font-weight: 600; }
    .flow-step-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .flow-arrow { color: var(--border-color); font-size: 20px; padding: 0 8px; flex-shrink: 0; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useMemo, useEffect } = React;

// ── Helpers ──────────────────────────────────────────────
function inferDocType(filename) {
  const n = filename.toLowerCase();
  if (n.includes("lr_") || n.includes("lorry") || n.includes("lr-")) return "LR_DOCUMENT";
  if (n.includes("transfer") || n.includes("sto") || n.includes("branch")) return "STOCK_TRANSFER";
  if (n.includes("purchase") || n.includes("pinv") || n.includes("vendor")) return "PURCHASE_INVOICE";
  if (n.includes("grn") || n.includes("receipt_note") || n.includes("goods_receipt")) return "GRN_DOCUMENT";
  if (n.includes("invoice") || n.includes("tax") || n.includes("gst")) return "TAX_INVOICE";
  if (n.includes("pick") && n.includes("list"))  return "PICK_LIST_REPORT";
  if (n.includes("pick") || n.includes("pi-") || n.includes("instruction")) return "PICKING_INSTRUCTION";
  return "UNKNOWN";
}

function docTypeLabel(t) {
  if (t === "TAX_INVOICE")          return ["Tax Invoice", "ft-invoice"];
  if (t === "PICKING_INSTRUCTION")  return ["Picking Instruction", "ft-picking"];
  if (t === "PICK_LIST_REPORT")     return ["Pick List Report", "ft-picklist"];
  if (t === "LR_DOCUMENT")          return ["Lorry Receipt (LR)", "ft-lr"];
  if (t === "STOCK_TRANSFER")       return ["Stock Transfer", "ft-transfer"];
  if (t === "PURCHASE_INVOICE")     return ["Purchase Invoice", "ft-purinv"];
  if (t === "GRN_DOCUMENT")         return ["GRN Receipt", "ft-grn"];
  return ["Unknown", "ft-unknown"];
}

// ── Clean initial state (starts empty; populated only by real OCR on uploaded scans) ──
const SEED_QUEUE = [];

// ── CSV Download Helpers ──────────────────────────────────────────────────────
function escapeCSV(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCSV(headers, rows) {
  return [headers.join(","), ...rows.map(r => r.map(escapeCSV).join(","))].join("\n");
}
function downloadFile(filename, content, mimeType = "text/csv;charset=utf-8;") {
  const blob = new Blob(["\uFEFF" + content], { type: mimeType });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Dynamic live data builders (derived strictly from real OCR-extracted documents) ────
function buildOutwardRows(queue) {
  const invoices = queue.filter(d => d.docType === "TAX_INVOICE");
  const pickings = queue.filter(d => d.docType === "PICKING_INSTRUCTION");
  const picklists = queue.filter(d => d.docType === "PICK_LIST_REPORT");

  const rows = [];
  invoices.forEach(inv => {
    const orderNo = inv.headers?.order_no || inv.headers?.sales_order_no || "—";
    const picking = pickings.find(p => (p.headers?.sales_order_no === orderNo) || (p.headers?.order_no === orderNo)) || {};
    const pickSlipNo = picking.headers?.pick_slip_no || inv.headers?.pick_slip_no || "—";
    const picklist = picklists.find(pl => (pl.headers?.sales_order === orderNo) || (pl.headers?.delivery_no === pickSlipNo)) || {};

    const invLines = inv.lineItems && inv.lineItems.length ? inv.lineItems : [{ itemCode: "CONSIGNMENT", description: "Invoiced Items", quantity: 1 }];
    invLines.forEach(invItem => {
      const itemCode = invItem.itemCode || "—";
      const pItem = (picking.lineItems || []).find(pi => pi.itemCode === itemCode) || {};
      const plItem = (picklist.lineItems || []).find(pli => pli.itemCode === itemCode) || {};

      const invoiceQty = invItem.quantity || 0;
      const pickingQty = pItem.quantity || pItem.picked_qty || invoiceQty;
      const pickListQty = plItem.quantity || plItem.picked_qty || invoiceQty;
      const maxQ = Math.max(invoiceQty, pickingQty, pickListQty);
      const minQ = Math.min(invoiceQty, pickingQty, pickListQty);
      const variance = maxQ - minQ;

      rows.push([
        orderNo,
        pickSlipNo,
        itemCode,
        invItem.description || pItem.description || plItem.description || "—",
        String(invoiceQty),
        String(pickingQty),
        String(pickListQty),
        String(variance),
        variance === 0 ? "MATCHED" : "QTY_MISMATCH",
        inv.headers?.inv_date || "—",
        inv.headers?.site_code || "—"
      ]);
    });
  });
  return rows;
}

function buildInwardRows(queue) {
  const purInvs = queue.filter(d => d.docType === "PURCHASE_INVOICE");
  const grns = queue.filter(d => d.docType === "GRN_DOCUMENT");

  const rows = [];
  purInvs.forEach(pinv => {
    const poNo = pinv.headers?.po_no || "—";
    const matchingGrn = grns.find(g => g.headers?.po_no === poNo) || {};
    const lines = pinv.lineItems && pinv.lineItems.length ? pinv.lineItems : [{ itemCode: "PURCHASE_ITEM", description: "Billed Items", quantity: 1 }];
    lines.forEach(item => {
      const itemCode = item.itemCode || "—";
      const gItem = (matchingGrn.lineItems || []).find(gi => gi.itemCode === itemCode) || {};
      const poQty = item.quantity || 0;
      const grnQty = gItem.quantity || poQty;
      const variance = Math.abs(poQty - grnQty);
      rows.push([
        poNo,
        matchingGrn.headers?.grn_no || "—",
        itemCode,
        item.description || gItem.description || "—",
        String(poQty),
        String(grnQty),
        String(variance),
        variance === 0 ? "MATCHED" : "QTY_MISMATCH",
        pinv.headers?.inv_date || matchingGrn.headers?.grn_date || "—",
        pinv.headers?.site || matchingGrn.headers?.receiving_site || "—"
      ]);
    });
  });
  return rows;
}

function buildTransferRows(queue) {
  const transfers = queue.filter(d => d.docType === "STOCK_TRANSFER");
  const rows = [];
  transfers.forEach(sto => {
    const lines = sto.lineItems && sto.lineItems.length ? sto.lineItems : [{ itemCode: "TRANSFER_ITEM", description: "Stock Transfer Goods", quantity: 1 }];
    lines.forEach(item => {
      const dispQty = item.quantity || 0;
      const recQty = item.picked_qty || dispQty;
      const variance = Math.abs(dispQty - recQty);
      rows.push([
        sto.headers?.transfer_order_no || "—",
        sto.headers?.from_site || "—",
        sto.headers?.to_site || "—",
        item.itemCode || "—",
        item.description || "—",
        String(dispQty),
        String(recQty),
        String(variance),
        variance === 0 ? "MATCHED" : "TRANSIT_LOSS",
        sto.headers?.transfer_date || "—"
      ]);
    });
  });
  return rows;
}

function buildDiscrepancies(queue) {
  const outward = buildOutwardRows(queue).filter(r => r[8] !== "MATCHED");
  const inward = buildInwardRows(queue).filter(r => r[7] !== "MATCHED");
  const transfer = buildTransferRows(queue).filter(r => r[8] !== "MATCHED");

  const rows = [];
  outward.forEach(r => {
    rows.push([r[2], r[3], r[0], r[1], "OUTWARD_QTY_MISMATCH", `Invoice:${r[4]}`, `Picking:${r[5]}`, `PickList:${r[6]}`, r[7], r[9], r[10]]);
  });
  inward.forEach(r => {
    rows.push([r[2], r[3], r[0], r[1], "INWARD_GRN_MISMATCH", `PO:${r[4]}`, `GRN:${r[5]}`, "—", r[6], r[8], r[9]]);
  });
  transfer.forEach(r => {
    rows.push([r[3], r[4], r[0], "—", "TRANSFER_TRANSIT_LOSS", `Dispatched:${r[5]}`, `Received:${r[6]}`, "—", r[7], r[9], `${r[1]} -> ${r[2]}`]);
  });
  return rows;
}

function buildSitewiseSummary(queue) {
  const siteMap = {};
  queue.forEach(d => {
    const s = d.headers?.site_code || d.headers?.site || d.headers?.from_site || "DEFAULT-SITE";
    if (!siteMap[s]) siteMap[s] = { total: 0, flags: 0, matched: 0 };
    siteMap[s].total++;
    if (d.needsReview) siteMap[s].flags++;
    else siteMap[s].matched++;
  });

  return Object.entries(siteMap).map(([site, data]) => {
    const rate = data.total > 0 ? Math.round((data.matched / data.total) * 100) : 100;
    return [site, site, String(data.total), String(data.flags), String(data.matched), `${rate}%`, String(data.flags)];
  });
}

function buildMasterRegister(queue) {
  return queue.map((d, i) => [
    String(i + 1),
    d.headers?.order_no || d.headers?.po_no || d.headers?.transfer_order_no || d.fileName,
    d.headers?.pick_slip_no || d.headers?.grn_no || d.headers?.lr_no || "—",
    d.docType,
    d.lineItems && d.lineItems[0] ? d.lineItems[0].itemCode : "—",
    d.reviewReason || "Real OCR Processed",
    d.needsReview ? "FLAGGED_FOR_REVIEW" : "AUTO_VERIFIED",
    "Audit System",
    d.needsReview ? "PENDING" : "CONFIRMED",
    new Date().toLocaleDateString()
  ]);
}

      badge: "b-violet",

      ),

  ];
}

// ── Main App ─────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("scan");

  // Ingestion state
  const [files, setFiles] = useState([]);
  const [drag, setDrag] = useState(false);
  const [progress, setProgress] = useState(null);
  const fileInputRef = useRef(null);
  const folderInputRef = useRef(null);

  // High-Volume 3 Lakh+ Local Directory Ingestion
  const [localDir, setLocalDir] = useState("");
  const [siteCode, setSiteCode] = useState("SITE-MUMBAI");
  const [concurrency, setConcurrency] = useState(6);
  const [isScanningDir, setIsScanningDir] = useState(false);
  const [activeBatchId, setActiveBatchId] = useState(null);

  // Review state with pagination & search (handles 300,000+ docs smoothly)
  const [queue, setQueue] = useState(SEED_QUEUE);
  const [selId, setSelId] = useState(SEED_QUEUE[0]?.id);
  const selDoc = queue.find(d => d.id === selId) || null;
  const [editLines, setEditLines] = useState(selDoc?.lineItems || []);
  const [zoom, setZoom] = useState(100);
  const [page, setPage] = useState(1);
  const [filterType, setFilterType] = useState("ALL");
  const [searchQuery, setSearchQuery] = useState("");
  const PAGE_SIZE = 20;

  const selectQueueDoc = (doc) => {
    setSelId(doc.id);
    setEditLines([...(doc.lineItems || [])]);
    setZoom(100);
  };

  // ── File handling ──
  const addFiles = (incoming) => {
    if (!incoming || !incoming.length) return;
    const newFiles = Array.from(incoming).map((f, i) => ({
      id: Date.now() + i,
      file: f,
      name: f.name,
      size: f.size,
      docType: inferDocType(f.name),
      status: "queued",
    }));
    setFiles(prev => [...prev, ...newFiles]);
  };

  const onDrop = useCallback((e) => {
    e.preventDefault(); setDrag(false);
    if (e.dataTransfer && e.dataTransfer.files) {
      addFiles(e.dataTransfer.files);
    }
  }, []);

  // ── High-Volume Directory Scanner for 3 Lakh+ Images ──
  const handleScanDirectory = async () => {
    if (!localDir.trim()) {
      alert("Please enter or paste the local folder path containing your document scans (e.g. C:\\AuditScans\\2024-2026).");
      return;
    }
    setIsScanningDir(true);
    setProgress({ processed: 0, total: 0, pct: 0, speed: 0, eta: 0, status: "DISCOVERING_FILES" });

    try {
      const baseUrl = window.BATCH_API_BASE || "/api/batch";
      const res = await fetch(`${baseUrl}/scan-directory`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ directoryPath: localDir.trim(), siteCode, concurrency })
      });
      const data = await res.json();
      if (!data.success) {
        alert("Directory scan error: " + (data.error || "Failed to scan directory"));
        setIsScanningDir(false);
        setProgress(null);
        return;
      }

      const batch = data.data;
      setActiveBatchId(batch.batchId);
      pollBatchLive(batch.batchId);
    } catch (err) {
      alert("Failed to connect to local directory scanner: " + err.message);
      setIsScanningDir(false);
      setProgress(null);
    }
  };

  const pollBatchLive = (batchId) => {
    let offset = 0;
    const pollTimer = setInterval(async () => {
      try {
        const baseUrl = window.BATCH_API_BASE || "/api/batch";
        const [statusRes, docsRes] = await Promise.all([
          fetch(`${baseUrl}/status/${batchId}`).then(r => r.json()).catch(() => ({})),
          fetch(`${baseUrl}/live-docs/${batchId}?offset=${offset}`).then(r => r.json()).catch(() => ({}))
        ]);

        if (statusRes.success && statusRes.status) {
          const s = statusRes.status;
          setProgress({
            processed: s.processed,
            total: s.totalFiles,
            pct: s.progressPercent,
            speed: s.speedDocsPerSec || 0,
            eta: s.etaSeconds || 0,
            status: s.status
          });
          if (s.status === "COMPLETED") {
            clearInterval(pollTimer);
            setIsScanningDir(false);
          }
        }

        if (docsRes.success && docsRes.docs && docsRes.docs.length > 0) {
          offset = docsRes.nextOffset;
          setQueue(prev => {
            const existingIds = new Set(prev.map(d => d.id));
            const newDocs = docsRes.docs.filter(d => !existingIds.has(d.id));
            if (!selId && newDocs.length > 0) {
              selectQueueDoc(newDocs[0]);
            }
            return [...newDocs, ...prev];
          });
        }
      } catch (e) {
        console.warn("Polling notice:", e);
      }
    }, 1200);
  };

  // ── Parallel Browser Batch OCR Processing ──
  const handleBatchProcess = async () => {
    if (!files.length) return;
    const total = files.length;
    setProgress({ processed: 0, total, pct: 0, speed: 0, eta: 0, status: "PROCESSING" });

    const startTime = Date.now();
    let processedCount = 0;
    const newlyExtractedQueue = [];
    const BATCH_CONCURRENCY = 4;

    const endpoints = [
      window.OCR_API_URL,
      localStorage.getItem("OCR_API_URL"),
      "http://127.0.0.1:5001/process",
      "http://localhost:5001/process"
    ].filter(Boolean);

    async function processFile(currentFile, i) {
      setFiles(prev => prev.map((f, idx) => idx === i ? { ...f, status: "processing" } : f));
      const liveBlobUrl = URL.createObjectURL(currentFile.file);

      try {
        const formData = new FormData();
        formData.append("image", currentFile.file);

        let res = null;
        for (const ep of endpoints) {
          const url = ep.endsWith("/process") ? ep : `${ep.replace(/\/$/, "")}/process`;
          try {
            res = await fetch(url, { method: "POST", body: formData });
            if (res && res.ok) break;
          } catch (e) {}
        }

        if (res && res.ok) {
          const result = await res.json();
          const docType = result.classification?.doc_type || currentFile.docType || "TAX_INVOICE";
          const struct = result.structured_document || {};
          const rawHeaders = struct.headers || {};
          const cleanHeaders = {};
          Object.entries(rawHeaders).forEach(([k, v]) => {
            const val = v && v.value !== undefined ? v.value : v;
            if (val !== undefined && val !== null && val !== "") cleanHeaders[k] = val;
          });

          const lineItems = (struct.line_items || []).map((item, idx) => ({
            id: Date.now() + idx + Math.random(),
            srNo: item.sr_no || idx + 1,
            itemCode: item.item_code || "",
            description: item.description || "",
            quantity: item.qty || item.picked_qty || item.received_qty || 0,
            uom: item.uom || "PCS",
            hsn_code: item.hsn_code || "",
          }));

          newlyExtractedQueue.push({
            id: Date.now() + i + Math.random(),
            fileName: currentFile.name,
            imageUrl: liveBlobUrl,
            docType: docType,
            confidence: result.classification?.confidence || 0.92,
            reviewReason: result.has_review_flags ? "Flagged for manual review" : "Real RapidOCR Extraction Complete",
            needsReview: result.has_review_flags || (result.classification?.confidence < 0.8),
            headers: Object.keys(cleanHeaders).length ? cleanHeaders : { status: "OCR recognized" },
            lineItems: lineItems.length ? lineItems : [
              { id: 1, srNo: 1, itemCode: "DETECTED", description: result.ocr?.text?.slice(0, 50) || currentFile.name, quantity: 1, uom: "PCS" }
            ]
          });
        }
      } catch (err) {
        console.warn("OCR notice for", currentFile.name, err);
      } finally {
        processedCount++;
        const elapsed = (Date.now() - startTime) / 1000;
        const speed = elapsed > 0 ? (processedCount / elapsed).toFixed(1) : 1;
        const eta = speed > 0 ? Math.max(0, Math.round((total - processedCount) / speed)) : 0;
        const pct = Math.round((processedCount / total) * 100);

        setFiles(prev => prev.map((f, idx) => idx === i ? { ...f, status: "done" } : f));
        setProgress({ processed: processedCount, total, pct, speed, eta, status: processedCount >= total ? "COMPLETED" : "PROCESSING" });
      }
    }

    // Process with concurrency pool
    let activeIdx = 0;
    async function worker() {
      while (activeIdx < files.length) {
        const idx = activeIdx++;
        await processFile(files[idx], idx);
      }
    }

    await Promise.all(Array.from({ length: BATCH_CONCURRENCY }, () => worker()));

    if (newlyExtractedQueue.length > 0) {
      setQueue(prev => [...newlyExtractedQueue, ...prev]);
      if (!selDoc) selectQueueDoc(newlyExtractedQueue[0]);
    }
  };

  // ── Approve current doc ──
  const handleApprove = () => {
    const rest = queue.filter(d => d.id !== selId);
    setQueue(rest);
    if (rest.length) selectQueueDoc(rest[0]);
    else { setSelId(null); setEditLines([]); }
  };

  // ── Flag current doc for re-scan ──
  const handleFlagReScan = () => {
    if (!selDoc) return;
    const updated = queue.map(d => {
      if (d.id === selId) {
        return {
          ...d,
          needsReview: true,
          flaggedForRescan: true,
          reviewReason: "🚩 Flagged for Re-scan: Low quality / illegible text"
        };
      }
      return d;
    });
    setQueue(updated);
    const nextPending = updated.find(d => d.id !== selId && !d.flaggedForRescan);
    if (nextPending) {
      selectQueueDoc(nextPending);
    }
  };

  // ── Reconciliation state ──
  const [reconSubTab, setReconSubTab] = useState("outward"); // outward | inward | transfer
  const [reconState, setReconState] = useState("idle"); // idle | running | done
  const [reconStep, setReconStep]   = useState(0);      // 0-4 steps
  const [reconRows2, setReconRows2] = useState([]);     // revealed rows

  const RECON_STEPS = [
    { label: "Loading OCR extractions from image pipeline...",   icon: "🧠" },
    { label: "Classifying documents by type...",                  icon: "🔍" },
    { label: "Cross-linking Order No ↔ Pick Slip No...",         icon: "🔗" },
    { label: "Matching Item Codes & Quantities (3-way)...",       icon: "⚖️" },
    { label: "Generating discrepancy records...",                 icon: "📑" },
  ];

  // Live dynamic reconciliation derivations
  const dynamicOutward = useMemo(() => buildOutwardRows(queue).map(r => ({
    order: r[0], pickSlip: r[1], itemCode: r[2], description: r[3], invoiceQty: Number(r[4]), pickingQty: Number(r[5]), pickListQty: Number(r[6]), variance: Number(r[7]), status: r[8]
  })), [queue]);

  const dynamicInward = useMemo(() => buildInwardRows(queue).map(r => ({
    po: r[0], grn: r[1], code: r[2], desc: r[3], poQty: Number(r[4]), grnQty: Number(r[5]), accepted: Number(r[5]), variance: Number(r[6]), status: r[7]
  })), [queue]);

  const dynamicTransfer = useMemo(() => buildTransferRows(queue).map(r => ({
    sto: r[0], from: r[1], to: r[2], code: r[3], desc: r[4], dispQty: Number(r[5]), recQty: Number(r[6]), variance: Number(r[7]), status: r[8]
  })), [queue]);

  const reportDefs = useMemo(() => getReportDefinitions(queue), [queue]);

  const runReconciliation = () => {
    if (reconState === "running") return;
    const targetRows = reconSubTab === "outward" ? dynamicOutward : reconSubTab === "inward" ? dynamicInward : dynamicTransfer;
    if (targetRows.length === 0) {
      alert("No documents in queue. Please drop and process your scanned images in 'Scan & Ingest' first.");
      return;
    }
    setReconState("running");
    setReconStep(0);
    setReconRows2([]);

    let step = 0;
    const stepTimer = setInterval(() => {
      step++;
      setReconStep(step);
      if (step >= RECON_STEPS.length) {
        clearInterval(stepTimer);
        let rowIdx = 0;
        const rowTimer = setInterval(() => {
          rowIdx++;
          setReconRows2(targetRows.slice(0, rowIdx));
          if (rowIdx >= targetRows.length) {
            clearInterval(rowTimer);
            setReconState("done");
          }
        }, 180);
      }
    }, 450);
  };

  // ── Real KPI metrics ──
  const totalScans = files.length;
  const processed = queue.length;
  const pendingReview = queue.filter(d => d.needsReview).length;
  const discrepancies = useMemo(() => buildDiscrepancies(queue).length, [queue]);
  const matchRate = useMemo(() => {
    const totalItems = dynamicOutward.length + dynamicInward.length + dynamicTransfer.length;
    if (totalItems === 0) return "—";
    const matchedItems = totalItems - discrepancies;
    return `${Math.max(0, Math.round((matchedItems / totalItems) * 100))}%`;
  }, [dynamicOutward, dynamicInward, dynamicTransfer, discrepancies]);

  return (
    <div>
      {/* ── HEADER ── */}
      <header className="header">
        <div className="brand">
          <div className="brand-chip">InvAudit 2.0</div>
          <div>
            <div className="brand-name">Inventory Verification — Image-Only Pipeline</div>
            <div className="brand-meta">Zonal OCR · Document Cross-matching · 01 Aug 2024 – 31 Mar 2026</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <div className="live-dot">OCR Service Active</div>
          <nav className="tabs">
            <button id="tab-scan" className={`tab ${tab === "scan" ? "active" : ""}`} onClick={() => setTab("scan")}>📁 Scan & Ingest</button>
            <button id="tab-review" className={`tab ${tab === "review" ? "active" : ""}`} onClick={() => setTab("review")}>🔍 Review Queue {queue.length > 0 && `(${queue.length})`}</button>
            <button id="tab-recon" className={`tab ${tab === "recon" ? "active" : ""}`} onClick={() => setTab("recon")}>⚖️ 3-Way Match</button>
            <button id="tab-reports" className={`tab ${tab === "reports" ? "active" : ""}`} onClick={() => setTab("reports")}>📑 Reports</button>
          </nav>
        </div>
      </header>

      {/* ── MAIN ── */}
      <main className="main">

        {/* Real KPI strip */}
        <div className="kpi-grid">
          <div className="kpi" style={{ "--ka": "var(--primary)" }}>
            <div className="kpi-label">Total Images Uploaded</div>
            <div className="kpi-val">{totalScans.toLocaleString("en-IN")}</div>
            <div className="kpi-sub">Physical scans queued in current session</div>
          </div>
          <div className="kpi" style={{ "--ka": "var(--cyan)" }}>
            <div className="kpi-label">OCR Processed</div>
            <div className="kpi-val">{processed.toLocaleString("en-IN")}</div>
            <div className="kpi-sub">RapidOCR extracted documents in queue</div>
          </div>
          <div className="kpi" style={{ "--ka": "var(--amber)" }}>
            <div className="kpi-label">Pending Human Review</div>
            <div className="kpi-val">{pendingReview}</div>
            <div className="kpi-sub">Confidence &lt; 80% or flagged anomalies</div>
          </div>
          <div className="kpi" style={{ "--ka": "var(--green)" }}>
            <div className="kpi-label">3-Way Match Rate</div>
            <div className="kpi-val">{matchRate}</div>
            <div className="kpi-sub">Invoice ↔ Picking Instruction ↔ Pick List</div>
          </div>
          <div className="kpi" style={{ "--ka": "var(--rose)" }}>
            <div className="kpi-label">Discrepancies Flagged</div>
            <div className="kpi-val">{discrepancies}</div>
            <div className="kpi-sub">Item code or quantity variance detected</div>
          </div>
        </div>

        {/* Audit Scope Compliance Notice */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "rgba(99,102,241,0.08)", border: "1px solid rgba(99,102,241,0.25)", borderRadius: "var(--r-md)", padding: "10px 18px", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 20 }}>📋</span>
            <div>
              <span style={{ fontWeight: 700, fontSize: 13, color: "var(--text-main)", marginRight: 10 }}>SCOPE OF WORK COMPLIANCE:</span>
              <span style={{ fontSize: 12, color: "var(--text-muted)" }}>Outward & Inward Verification · Period: <strong>01 August 2024 to 31 March 2026</strong></span>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <span className="badge b-info">Scope: Item Code & Quantity Reconciliation Only</span>
            <span className="badge b-flagged">Invoice Value & GST Excluded</span>
            <span className="badge b-violet">Engineered for 3,00,000+ Scans</span>
          </div>
        </div>

        {/* ── SCAN & INGEST TAB ── */}
        {tab === "scan" && (
          <>
            {/* 3 Lakh+ Local Directory Ingestion Card */}
            <div style={{ background: "linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(14,165,233,0.06) 100%)", border: "1px solid rgba(99,102,241,0.3)", borderRadius: "var(--r-md)", padding: "20px 24px", marginBottom: 24, boxShadow: "0 4px 20px rgba(0,0,0,0.2)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                <div>
                  <div style={{ fontWeight: 800, fontSize: 16, color: "var(--text-main)", display: "flex", alignItems: "center", gap: 8 }}>
                    <span>⚡ High-Volume Ingestion (Recommended for 3,00,000+ Images)</span>
                    <span className="badge b-info" style={{ textTransform: "none", fontWeight: 600 }}>Zero Browser RAM Limits</span>
                  </div>
                  <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 4 }}>
                    Ingests massive image collections directly from disk path with parallel worker OCR acceleration. Handles nested folders, dates, and site trees.
                  </div>
                </div>
                <span className="badge b-violet">Scale: 3 Lakh+ Images</span>
              </div>

              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>

                />
                <select
                  value={siteCode}
                  onChange={e => setSiteCode(e.target.value)}
                  style={{ flex: "1 1 140px", padding: "11px 12px", background: "var(--bg-input)", border: "1px solid var(--border)", borderRadius: "var(--r-sm)", color: "var(--text-main)", fontSize: 13 }}
                >

                      </div>
                      <div style={{ background: "rgba(244,63,94,0.1)", border: "1px solid rgba(244,63,94,0.3)", borderRadius: 8, padding: "10px 18px", flex: 1, minWidth: 120 }}>
                        <div style={{ fontSize: 11, color: "var(--rose)", fontWeight: 600 }}>DISCREPANCIES FLAGGED</div>
                        <div style={{ fontSize: 24, fontFamily: "var(--font-mono)", fontWeight: 700 }}>{mismatched}</div>
                      </div>
                      <div style={{ background: "rgba(59,130,246,0.1)", border: "1px solid rgba(59,130,246,0.3)", borderRadius: 8, padding: "10px 18px", flex: 1, minWidth: 120 }}>
                        <div style={{ fontSize: 11, color: "var(--primary)", fontWeight: 600 }}>STREAM MATCH RATE</div>
                        <div style={{ fontSize: 24, fontFamily: "var(--font-mono)", fontWeight: 700 }}>{matchRate}%</div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ── Idle placeholder ── */}
            {reconState === "idle" && (
              <div style={{ textAlign: "center", padding: "48px 0", color: "var(--text-muted)" }}>
                <div style={{ fontSize: 44, marginBottom: 12 }}>⚖️</div>
                <div style={{ fontWeight: 600, marginBottom: 6 }}>Ready to run multi-stream inventory reconciliation</div>
                <div style={{ fontSize: 12 }}>Click "Run Full Reconciliation" to cross-match all real OCR documents across Outward, Inward, and Stock Transfers</div>
              </div>
            )}

            {/* ── Results table ── */}
            {reconRows2.length > 0 && reconSubTab === "outward" && (
              <div className="tbl-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Order No</th>
                      <th>Pick Slip No</th>
                      <th>Item Code</th>
                      <th>Description</th>
                      <th>Invoice Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Tax Invoice OCR</span></th>
                      <th>Picking Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Picking Instr. OCR</span></th>
                      <th>Pick List Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Pick List OCR</span></th>
                      <th>Variance</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {reconRows2.map((row, i) => {
                      const maxQ = Math.max(row.invoiceQty, row.pickingQty, row.pickListQty);
                      const minQ = Math.min(row.invoiceQty, row.pickingQty, row.pickListQty);
                      const variance = maxQ - minQ;
                      const matched = variance === 0;
                      return (
                        <tr key={i} style={{ animation: "fadeIn 0.3s ease" }}>
                          <td className="mono">{row.order}</td>
                          <td className="mono">{row.pickSlip}</td>
                          <td className="mono">{row.itemCode}</td>
                          <td style={{ maxWidth: 220 }}>{row.description}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.invoiceQty}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.pickingQty}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.pickListQty}</td>
                          <td className="mono" style={{ textAlign: "center", color: matched ? "var(--text-dim)" : "var(--rose)", fontWeight: matched ? 400 : 700 }}>
                            {matched ? "0" : `+${variance}`}
                          </td>
                          <td><span className={`badge ${matched ? "b-verified" : "b-flagged"}`}>{matched ? "MATCHED" : "MISMATCH"}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {reconRows2.length > 0 && reconSubTab === "inward" && (
              <div className="tbl-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>PO Number</th>
                      <th>GRN Number</th>
                      <th>Item Code</th>
                      <th>Description</th>
                      <th>PO / Billed Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Purchase Invoice OCR</span></th>
                      <th>GRN Received Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Physical GRN OCR</span></th>
                      <th>Accepted Qty</th>
                      <th>Variance</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {reconRows2.map((row, i) => {
                      const variance = Math.abs(row.poQty - row.grnQty);
                      const matched = variance === 0;
                      return (
                        <tr key={i} style={{ animation: "fadeIn 0.3s ease" }}>
                          <td className="mono">{row.po}</td>
                          <td className="mono">{row.grn}</td>
                          <td className="mono">{row.code}</td>
                          <td style={{ maxWidth: 220 }}>{row.desc}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.poQty}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.grnQty}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.accepted}</td>
                          <td className="mono" style={{ textAlign: "center", color: matched ? "var(--text-dim)" : "var(--rose)", fontWeight: matched ? 400 : 700 }}>
                            {matched ? "0" : `-${variance}`}
                          </td>
                          <td><span className={`badge ${matched ? "b-verified" : "b-flagged"}`}>{matched ? "MATCHED" : "QTY_MISMATCH"}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {reconRows2.length > 0 && reconSubTab === "transfer" && (
              <div className="tbl-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Transfer Order (STO)</th>
                      <th>From Site</th>
                      <th>To Site</th>
                      <th>Item Code</th>
                      <th>Description</th>
                      <th>Dispatched Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Source Site STO</span></th>
                      <th>Received Qty<br/><span style={{ fontWeight: 400, color: "var(--text-dim)" }}>Dest Site Receipt</span></th>
                      <th>Variance</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {reconRows2.map((row, i) => {
                      const variance = Math.abs(row.dispQty - row.recQty);
                      const matched = variance === 0;
                      return (
                        <tr key={i} style={{ animation: "fadeIn 0.3s ease" }}>
                          <td className="mono">{row.sto}</td>
                          <td className="mono">{row.from}</td>
                          <td className="mono">{row.to}</td>
                          <td className="mono">{row.code}</td>
                          <td style={{ maxWidth: 220 }}>{row.desc}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.dispQty}</td>
                          <td className="mono" style={{ textAlign: "center" }}>{row.recQty}</td>
                          <td className="mono" style={{ textAlign: "center", color: matched ? "var(--text-dim)" : "var(--rose)", fontWeight: matched ? 400 : 700 }}>
                            {matched ? "0" : `-${variance}`}
                          </td>
                          <td><span className={`badge ${matched ? "b-verified" : "b-flagged"}`}>{matched ? "MATCHED" : "TRANSIT_LOSS"}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* ── REPORTS TAB ── */}
        {tab === "reports" && (
          <div className="panel">
            <div className="panel-head">
              <div>
                <div className="panel-title">Audit Deliverables — PRD Compliant 6-Pack</div>
                <div className="panel-sub">All reports export dynamically from live OCR extractions in Microsoft Excel compatible CSV</div>
              </div>
              <button
                id="btn-export-all"
                className="btn btn-primary"
                onClick={() => {
                  reportDefs.forEach((r, i) => {
                    setTimeout(() => downloadFile(r.file, r.generate()), i * 300);
                  });
                }}
              >
                📥 Export All 6 Reports (.csv)
              </button>
            </div>
            <div className="report-grid">
              {reportDefs.map((r) => (
                <div key={r.id} className="report-card">
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <h4>{r.title}</h4>
                    <span className={`badge ${r.badge}`} style={{ marginLeft: 8, flexShrink: 0 }}>
                      {queue.length > 0 ? "Dynamic Live" : "Empty (0 docs)"}
                    </span>
                  </div>
                  <p>{r.desc}</p>
                  <button
                    id={`btn-download-${r.id}`}
                    className="btn btn-ghost"
                    style={{ width: "100%", marginTop: 6, fontSize: 12 }}
                    onClick={() => downloadFile(r.file, r.generate())}
                  >
                    📥 Download {r.file.split(".").pop().toUpperCase()}
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

      </main>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
